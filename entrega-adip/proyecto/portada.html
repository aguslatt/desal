<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Portada reel · EQUIPO ADIP</title>
<style>

*{margin:0;padding:0;box-sizing:border-box}

.k{left:76px;top:462px;display:flex;align-items:center;gap:12px;color:#fff;font-weight:600;font-size:30px;letter-spacing:.2em}
.k i{width:26px;height:26px;border-radius:50%;display:block}
.adm{left:70px;top:510px;color:#fff;font-weight:600;font-size:104px;letter-spacing:-.012em;line-height:1.1;text-shadow:0 4px 24px rgba(0,0,0,.35)}
.num{left:62px;top:600px;color:#FE801C;font-weight:700;font-size:262px;letter-spacing:-.03em;line-height:1;text-shadow:0 6px 30px rgba(0,0,0,.30)}

.pill{left:50%;top:1470px;transform:translateX(-50%);background:#EFEFEF;border-radius:90px;padding:4px 34px;box-shadow:0 14px 34px rgba(0,0,0,.28)}
.pill img{display:block;width:290px}
</style></head><body>
<div class="abs" id="bg"></div><div class="abs" id="foto"></div><div class="abs" id="vel"></div>
